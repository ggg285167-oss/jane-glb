name: usdz-to-glb

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0

      - name: blender
        run: |
          curl -L -f -o blender.tar.xz https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz
          tar -xf blender.tar.xz

      - name: convert
        run: |
          ./blender-4.3.2-linux-x64/blender -b --python export_usdz.py
          ls -lh Kei.glb

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: Kei-glb
          path: Kei.glb
          retention-days: 7
